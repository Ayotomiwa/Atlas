schema_version: atlas-taxonomy/1.0
relationships:
  - {name: atlas.depends-on, meaning: Cannot operate correctly without the target, reciprocal: has-dependent}
  - {name: atlas.consumes, meaning: Reads data events API output or another artefact, reciprocal: produces-for}
  - {name: atlas.produces, meaning: Creates data events or artefacts, reciprocal: consumed-by}
  - {name: atlas.participates-in, meaning: Component is part of a flow, reciprocal: contains-component}
  - {name: atlas.deployed-by, meaning: Created or deployed through target infrastructure, reciprocal: deploys}
  - {name: atlas.must-follow, meaning: Target standard is mandatory for this concept, reciprocal: applies-to}
  - {name: atlas.owned-by, meaning: Accountable team or role, reciprocal: owns}
  - {name: atlas.implemented-by, meaning: Concept is realised by target component or computation, reciprocal: implements}
  - {name: atlas.derived-from, meaning: Knowledge or output is based on target, reciprocal: source-for}
  - {name: atlas.supersedes, meaning: Replaces an older concept or decision, reciprocal: superseded-by}
  - {name: atlas.operated-by, meaning: Target runbook covers operating this concept, reciprocal: covers}
  - {name: atlas.informed-by, meaning: Target incident learning is relevant to this concept, reciprocal: informs}
  - {name: atlas.extends, meaning: Specialises a broader standard without weakening it, reciprocal: extended-by}
map_verb_mapping:
  - {relationship: atlas.consumes, target_kind: event, verb: consumes_event}
  - {relationship: atlas.consumes, target_kind: table, verb: reads_table}
  - {relationship: atlas.consumes, target_kind: api, verb: calls_api}
  - {relationship: atlas.consumes, target_kind: file, verb: consumes_file}
  - {relationship: atlas.consumes, target_kind: job-output, verb: depends_on_job_output}
  - {relationship: atlas.consumes, target_kind: config, verb: depends_on_config}
  - {relationship: atlas.produces, target_kind: event, verb: produces_event}
  - {relationship: atlas.produces, target_kind: table, verb: writes_table}
  - {relationship: atlas.produces, target_kind: api, verb: exposes_api}
  - {relationship: atlas.produces, target_kind: file, verb: publishes_file}
  - {relationship: atlas.depends-on, target_kind: shared-library, verb: uses_shared_library}
  - {relationship: atlas.depends-on, target_kind: schema-library, verb: uses_schema_library}
  - {relationship: atlas.depends-on, target_kind: component, verb: depends_on_component}
