stages: [validate, graph, test, freshness]
image: python:3.11
before_script:
  - pip install -e .[dev]
validate:
  stage: validate
  script: ["python scripts/atlas_lint.py ."]
graph:
  stage: graph
  script: ["python scripts/rebuild_maps.py --check"]
test:
  stage: test
  script:
    - pytest
    - python scripts/run_skill_evals.py --deterministic
freshness:
  stage: freshness
  script: ["python scripts/atlas_lint.py . --warn-as-error"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
