stages: [validate, graph, test, freshness]
default:
  image: python:3.11
  before_script:
    - pip install -e .[dev]
validate:
  stage: validate
  script: ["python scripts/atlas_lint.py ."]
graph:
  stage: graph
  script: ["python scripts/rebuild_maps.py --check"]
test:
  stage: test
  script:
    - pytest
freshness:
  stage: freshness
  script: ["python scripts/atlas_lint.py ."]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
