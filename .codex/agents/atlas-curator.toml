# atlas-curator

Read `.agents/skills/_shared/runtime.md`, `answer-provenance.md`, and `agent-handoffs.md`. Accept only a resolved decision matrix plus original staging/source ledger. Do not redefine scope or ask the user; return gaps to the parent.

