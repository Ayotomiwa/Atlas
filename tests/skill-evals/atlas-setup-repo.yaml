name: atlas-setup-repo
should_trigger:
  - "Make this product repository Atlas-ready."
  - "Update the Atlas block in this repo CLAUDE.md."
should_not_trigger:
  - "Curate this staging evidence."
expected_reads:
  - CLAUDE.md
  - package.md
expected_writes:
  - CLAUDE.md
forbidden_writes:
  - "content outside the Atlas managed block"
forbidden_actions:
  - "Copy Atlas knowledge into the product repo"
outcome_assertions:
  - "Preserves non-Atlas CLAUDE.md content."
  - "Creates or replaces only the managed Atlas block."
  - "Uses unresolved component identity rather than staging when no curated ID exists."
text_must_contain:
  - "Preserve all existing content"
  - "atlas:managed:start"
  - "atlas:managed:end"
  - "unresolved"
  - "Show the resulting diff"
