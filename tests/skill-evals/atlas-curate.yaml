name: atlas-curate
should_trigger:
  - "Curate this new staging evidence into the component area."
  - "Reconcile this new staged standard candidate with curated Atlas."
should_not_trigger:
  - "Stage this raw fact only."
  - "Recurate this staging record that is already status curated."
expected_reads:
  - _staging/README.md
  - "source staging evidence and its bucket contract when needed"
  - taxonomy/types.yaml
  - taxonomy/relationships.yaml
  - taxonomy/statuses.yaml
  - _curated/<target>/README.md
  - _curated/<target>/_template.md
  - _curated/<target>/index.md
expected_writes:
  - "source staging record status only"
  - _curated/<target>/<page>.md
  - _curated/<target>/index.md
  - _curated/maps/
  - _curated/status/curation-status.md
forbidden_writes:
  - "staging evidence body/provenance/path/ID"
  - reviews/
forbidden_actions:
  - "Automatically curate terminal staging statuses"
  - "Set curated concept page status curated"
  - "Self-approve"
  - "Merge"
  - "Upgrade rich staging detail to reviewed fact without evidence"
outcome_assertions:
  - "Uses status new as the normal curation queue and avoids duplicate active/terminal work."
  - "Reads target README, template, and index before writing."
  - "Preserves relevant domain-specific staging detail and uncertainty."
  - "Keeps Claude-created curated pages at status proposed."
  - "Changes only staging lifecycle status after capture."
  - "Uses the Atlas PR/MR as the curation review record."
  - "Keeps curation-status as a compact latest checkpoint."
  - "Regenerates maps and runs validation."
  - "Never self-approves or merges."
text_must_contain:
  - "status: new"
  - "status: curating"
  - "status: proposed"
  - "reviews/"
  - "PR/MR"
  - "README.md"
  - "_template.md"
  - "index.md"
  - "rebuild_maps.py"
  - "Never merge"
