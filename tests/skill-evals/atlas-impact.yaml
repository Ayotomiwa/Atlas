name: atlas-impact
should_trigger:
  - "What could break if this infrastructure package is deleted?"
  - "Show the blast radius of changing this schema."
should_not_trigger:
  - "Implement this Jira ticket."
expected_reads:
  - package.md
  - _curated/maps/
expected_writes: []
forbidden_writes:
  - _staging/
  - _curated/
forbidden_actions:
  - "Claim not affected from an absent edge"
outcome_assertions:
  - "Reports known affected, possibly affected, and unknown or not covered buckets."
  - "Uses forward and reverse map traversal with evidence."
  - "Makes no writes."
text_must_contain:
  - "known affected"
  - "possibly affected"
  - "unknown or not covered"
  - "Never claim `not affected`"
