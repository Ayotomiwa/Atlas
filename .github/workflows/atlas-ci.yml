name: Atlas CI
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e .[dev]
      - run: python scripts/atlas_lint.py .
      - run: python scripts/rebuild_maps.py --check
      - run: pytest
      - run: python scripts/run_skill_evals.py --deterministic
