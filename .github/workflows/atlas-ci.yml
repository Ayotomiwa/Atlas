name: Atlas V1 Finalizer

on:
  push:
    branches:
      - feat/team-atlas-v1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final scaffold
        shell: bash
        run: |
          cat .atlas-payload/chunk-* | base64 --decode > /tmp/team-atlas.tar.gz
          rm -rf .claude .github _curated _staging onboarding reviews scripts taxonomy tests
          rm -f .gitignore .gitlab-ci.yml CLAUDE.md CODEOWNERS README.md index.md log.md package.md pyproject.toml
          tar -xzf /tmp/team-atlas.tar.gz
          rm -rf .atlas-payload
      - name: Install
        run: pip install -e .[dev]
      - name: Validate
        run: |
          python scripts/atlas_lint.py .
          python scripts/rebuild_maps.py --check
          pytest -q
          python scripts/run_skill_evals.py --deterministic
      - name: Commit final scaffold
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .claude .github .gitignore .gitlab-ci.yml CLAUDE.md CODEOWNERS README.md _curated _staging index.md log.md onboarding package.md pyproject.toml reviews scripts taxonomy tests
          git add -u -- .atlas-payload
          git status --short
          if git diff --cached --quiet; then
            echo "No final scaffold changes to commit."
            exit 0
          fi
          git commit -m "chore: finalize Team Atlas V1 implementation"
          git push origin HEAD:feat/team-atlas-v1
