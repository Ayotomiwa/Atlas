name: bootstrap-atlas-v1
on:
  push:
    branches: [feat/team-atlas-v1-implementation]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git fetch --depth=1 origin feat/team-atlas-v1-implementation
          git checkout -B feat/team-atlas-v1-implementation FETCH_HEAD
      - name: Expand validated V1 tree
        run: |
          cat .atlas-bootstrap/part* | base64 -d | tar -xz
      - name: Apply packaging and CI policy fixes
        run: |
          cat >> pyproject.toml <<'EOF'

          [tool.setuptools]
          packages = []
          EOF
          cat > .github/workflows/atlas-ci.yml <<'EOF'
          name: atlas-ci
          on:
            push:
            pull_request:
            schedule:
              - cron: '0 8 * * 1'
          permissions:
            contents: read
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
                  with:
                    python-version: '3.11'
                - run: pip install -e .[dev]
                - run: python scripts/atlas_lint.py .
                - run: python scripts/rebuild_maps.py --check
                - run: pytest
                - run: python scripts/run_skill_evals.py --deterministic
            freshness:
              if: github.event_name == 'schedule'
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
                  with:
                    python-version: '3.11'
                - run: pip install -e .[dev]
                - run: python scripts/atlas_lint.py . --warn-as-error
          EOF
      - name: Validate repository
        run: |
          python --version
          pip install -e .[dev]
          python scripts/atlas_lint.py .
          python scripts/rebuild_maps.py --check
          pytest
          python scripts/run_skill_evals.py --deterministic
      - name: Commit validated non-workflow implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md CLAUDE.md package.md index.md log.md CODEOWNERS .gitignore pyproject.toml .gitlab-ci.yml taxonomy _curated _staging reviews onboarding .claude scripts tests
          git commit -m "feat: implement Team Atlas V1 scaffold"
          git push origin HEAD:feat/team-atlas-v1-implementation
