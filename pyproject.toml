[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "datalens-atlas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.setuptools]
packages = []
